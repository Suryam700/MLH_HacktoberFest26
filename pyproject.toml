[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicfix-ai"
version = "0.1.0"
description = "AI-assisted civic complaint preparation MVP"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40,<2",
    "google-genai>=1.0,<2",
    "pydantic>=2.7,<3",
    "Pillow>=10.0",
    "folium>=0.17",
    "streamlit-folium>=0.24",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
